<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#05090D" />
<title>Streamflix – Player</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{--bg:#05090D;--bg2:#0A1119;--accent:#FF003D;--text:#F5F7FA;--text2:#A7B4C4;--border:rgba(95,160,200,.2)}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  header{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--border)}
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--text2)} .back:hover{color:#fff}
  .brand{margin-left:auto;font-weight:800} .brand b{color:var(--accent)}
  main{max-width:1100px;margin:0 auto;padding:20px}
  .stage{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--bg2)}
  .stage>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.45)}
  .stage video,.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
  .msg{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;gap:10px;padding:24px}
  .msg h2{font-size:20px} .msg p{color:var(--text2);max-width:52ch;font-size:14px}
  .btn{display:inline-flex;align-items:center;height:38px;padding:0 18px;border-radius:999px;background:var(--accent);font-weight:600;font-size:13px;border:0;cursor:pointer;color:#fff}
  .info{display:flex;gap:20px;margin-top:22px}
  .info img{width:120px;border-radius:10px;border:1px solid var(--border);flex:none;align-self:flex-start}
  h1{font-size:26px;font-weight:800} .meta{color:var(--text2);margin:6px 0 12px;font-size:13px}
  .over{color:#dbe3ec;line-height:1.6;max-width:70ch;font-size:14px}
  .trailer{margin-top:28px} .trailer h3{font-size:15px;margin-bottom:10px}
  .trailer .stage{max-width:760px}
  @media(max-width:600px){main{padding:12px}.info img{width:84px}h1{font-size:20px}}
</style>
</head>
<body>
<header>
  <a id="back" class="back" href="/#/">&larr; Back</a>
  <span class="brand">STREAM<b>FLIX</b></span>
</header>
<main id="app" aria-live="polite"><p style="color:var(--text2)">Loading…</p></main>
<script>
(function () {
  var app = document.getElementById('app');
  var p = new URLSearchParams(location.search);
  var id = p.get('id'), type = p.get('type');

  function el(tag, props, kids) {
    var n = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) { if (k === 'text') n.textContent = props[k]; else n.setAttribute(k, props[k]); });
    (kids || []).forEach(function (c) { n.appendChild(c); });
    return n;
  }
  function fail(title, text) {
    app.replaceChildren(el('div', { 'class': 'msg', style: 'position:static;padding:60px 0' }, [
      el('h2', { text: title }), el('p', { text: text }), el('a', { 'class': 'btn', href: '/#/', text: 'Go to Streamflix' })]));
  }

  if (!/^\d{1,9}$/.test(id || '') || (type !== 'movie' && type !== 'tv')) {
    return fail('Invalid player link', 'The link needs a numeric id and a type of movie or tv, for example player.html?id=550&type=movie.');
  }
  document.getElementById('back').href = '/#/title/' + type + '/' + id;

  var isHttps = function (u) { try { return new URL(u).protocol === 'https:'; } catch (e) { return false; } };

  Promise.all([
    fetch('/api/tmdb?op=details&type=' + type + '&id=' + id).then(function (r) { return r.json().then(function (b) { if (!b.ok) throw new Error(b.error && b.error.message || 'Request failed'); return b.data; }); }),
    // Authorized sources are listed by the site owner in /sources.json: {"movie:550": {"kind":"mp4"|"embed","url":"https://..."}}
    fetch('/sources.json', { cache: 'no-cache' }).then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; })
  ]).then(function (res) {
    var d = res[0], sources = res[1] || {};
    var title = d.title || d.name || 'Untitled';
    document.title = title + ' – Streamflix';
    var year = (d.release_date || d.first_air_date || '').slice(0, 4);
    var src = sources[type + ':' + id];
    var stage = el('div', { 'class': 'stage' });

    if (src && isHttps(src.url) && src.kind === 'mp4') {
      var v = el('video', { controls: '', playsinline: '', preload: 'metadata', src: src.url });
      if (d.backdrop_path) v.setAttribute('poster', 'https://image.tmdb.org/t/p/w1280' + d.backdrop_path);
      stage.appendChild(v);
    } else if (src && isHttps(src.url) && src.kind === 'embed') {
      stage.appendChild(el('iframe', { src: src.url, title: title, allow: 'autoplay; fullscreen; picture-in-picture', allowfullscreen: '', referrerpolicy: 'no-referrer' }));
    } else {
      if (d.backdrop_path) stage.appendChild(el('img', { 'class': 'bg', src: 'https://image.tmdb.org/t/p/w1280' + d.backdrop_path, alt: '' }));
      stage.appendChild(el('div', { 'class': 'msg' }, [
        el('h2', { text: 'Playback isn’t available for this title' }),
        el('p', { text: 'TMDB provides information and artwork only, and no authorized stream is configured for this title. You can still watch the trailer below when one exists.' })
      ]));
    }

    var info = el('div', { 'class': 'info' }, []);
    if (d.poster_path) info.appendChild(el('img', { src: 'https://image.tmdb.org/t/p/w342' + d.poster_path, alt: title, loading: 'lazy' }));
    var meta = [year, d.vote_average ? '★ ' + d.vote_average.toFixed(1) : ''].filter(Boolean).join('  ·  ');
    info.appendChild(el('div', {}, [el('h1', { text: title }), el('p', { 'class': 'meta', text: meta }), el('p', { 'class': 'over', text: d.overview || '' })]));

    var nodes = [stage, info];
    var vids = ((d.videos && d.videos.results) || []).filter(function (x) { return x.site === 'YouTube' && /^[\w-]{6,15}$/.test(x.key); });
    var t = vids.filter(function (x) { return x.type === 'Trailer'; })[0] || vids[0];
    if (t) {
      nodes.push(el('section', { 'class': 'trailer' }, [el('h3', { text: 'Trailer' }),
        el('div', { 'class': 'stage' }, [el('iframe', { src: 'https://www.youtube-nocookie.com/embed/' + t.key, title: title + ' trailer', loading: 'lazy', allow: 'encrypted-media; picture-in-picture; fullscreen', allowfullscreen: '' })])]));
    }
    app.replaceChildren.apply(app, nodes);
  }).catch(function (e) {
    fail('Couldn’t load this title', e.message || 'Please try again.');
  });
})();
</script>
</body>
</html>
